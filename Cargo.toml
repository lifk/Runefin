[workspace]
resolver = "3"
members = ["crates/jellyfin-api", "crates/seerr-api", "crates/runefin"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/lifk/Runefin"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
print_stdout = "warn"

# Debug info is off on purpose. A debug build of Rune plus wgpu at full `debug = 2` is ~6 GB of
# artifacts, which does not fit a small dev box; frame asserts and snapshot tests do not need it.
# This mirrors Rune's own workspace, which sets `debug = false` for every dependency.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

# Fastest edit-compile-run loop: same as `dev` but with parallel codegen and a quicker relink.
# Use it for local iteration (`cargo build --profile dev-fast`, `cargo run --profile dev-fast`).
[profile.dev-fast]
inherits = "dev"
debug = 0
codegen-units = 64

# Optimized without fat LTO: quick perf checks and local release builds that do not need the
# shipped profile's 10 GB peak. Packaging still uses `release` in CI.
[profile.release-quick]
inherits = "release"
lto = false
codegen-units = 16

# Near-release speed at a fraction of fat LTO's build time and memory.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

# Profiler symbols without fat LTO.
[profile.perf]
inherits = "release-quick"
incremental = false
debug = 1

# Rune is pinned to one rev: it is pre-1.0 and its `dev` branch moves ~100 commits a day.
# Bump deliberately, one commit, and rerun `scripts/snapshots.sh` before and after.
# https://github.com/anomalyco/rune/commit/f5def6d4f9259580cbbd6472498e4de6b4d754b6

# Upstream's flat-tree fix: AccessKit items read their own `size_of_set` before falling back to
# the container's, so levelled items in a flat tree report their own level's setsize to Linux
# AT-SPI. Rune's workspace patches its vendored copy; a downstream workspace must patch it too.
[patch.crates-io]
accesskit_atspi_common = { git = "https://github.com/lifk/rune", rev = "c2e2eb6c7b9d519d0a673eca35f5c40bce5b5e07" }
