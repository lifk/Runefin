# Reference ~/.config/cecd/config.toml for Runefin on a Steam Machine.
#
# cecd's mapping applies to the whole SteamOS session, so Runefin only needs the
# Menu buttons: OK, Back and the D-pad keep cecd's defaults (Return, Escape and the
# arrow keys), and Runefin's big-screen mode takes Return and the arrows itself.
#
# Install it with packaging/flatpak/setup-cecd.sh, which merges these keys into an
# existing config and backs it up first. Then restart cecd:
#
#   systemctl --user restart cecd
#
# Numeric values are from /usr/include/linux/input-event-codes.h.

[mappings]
# Context menu: opens a poster's item menu in Runefin.
contents-menu = 438              # KEY_CONTEXT_MENU
media-context-sensitive-menu = 438
